name: bancs d'essai
on: [push, pull_request]
jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Serveur — fichiers servis, Host, API, tuiles, cache (sans réseau)
        run: python test/banc-serveur.py
      - name: Foudre — LZW, trames websocket, tampon (sans réseau)
        run: python foudre.py
      - name: Page — score, alertes, vigilance, ensemble, impacts
        run: node test/test_calc.js
      - name: Appairage — code, jeton et cookie partagés
        run: python appairage.py
      - name: appairage.py est le même que celui de web_suite
        run: |
          git clone --quiet --depth 1 https://github.com/pilou33620/web_suite.git ../web_suite
          diff <(tr -d '\r' < ../web_suite/lanceur/appairage.py) <(tr -d '\r' < appairage.py)
