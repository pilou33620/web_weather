name: bancs d'essai
on: [push, pull_request]
permissions:
  contents: read
jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # serveur (fichiers servis, Host, API, tuiles, cache, sans réseau), foudre (LZW, tampon), ligne de commande
      - name: Serveur et foudre (Rust)
        run: cargo test --release -p weather 2>&1 | tail -30; exit ${PIPESTATUS[0]}
        shell: bash
      # Cargo.lock n'est pas encore suivi : il est produit ici, une fois, pour être versé au dépôt
      - uses: actions/upload-artifact@v4
        with: { name: Cargo.lock, path: Cargo.lock }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Page — score, alertes, vigilance, ensemble, impacts
        run: node test/test_calc.js
      - name: Interface (syntaxe)
        run: for f in sw.js js/*.js test/*.js; do node --check "$f" || exit 1; done
