<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Météo orage">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="css/icone.svg" type="image/svg+xml">
<title>web_weather</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <button class="rond" id="b-gauche" aria-label="Ma position"></button>
  <h1 id="titre">…</h1>
  <div class="duo" id="b-droite">
    <button class="rond" id="b-cloche" aria-label="Alertes"><span class="badge" id="badge" hidden></span></button>
    <button class="rond" id="b-loupe" aria-label="Rechercher un lieu"></button>
  </div>
  <button class="rond" id="b-centre" aria-label="Recentrer la carte" hidden></button>
</header>
<div id="banniere" role="status" hidden></div>

<section id="p-chasse" class="page" aria-label="Chasse orage">
  <div id="carte"></div>
  <div class="sur haut">
    <div class="pilule" id="pl-flux">…</div>
    <div class="pilule leg" id="pl-legende"></div>
    <div class="pilule" id="pl-risque"></div>
    <div class="pilule alerte-carte" id="pl-approche" role="alert" hidden></div>
  </div>
  <div class="sur bas">
    <div class="info-carte" id="info-carte" hidden></div>
    <div class="station" id="station"></div>
    <div class="lecteur" id="lect-cape" hidden>
      <span>Prévi.</span><input type="range" id="cape-h" min="0" max="0" value="0" aria-label="Heure de prévision (CAPE, vent)"><span id="cape-t">…</span>
    </div>
    <div class="lecteur">
      <button id="play" aria-label="Lecture">▶</button>
      <input type="range" id="curseur" min="0" max="0" value="0" aria-label="Temps du radar et de la foudre">
      <span id="curseur-t">…</span>
    </div>
    <div class="couches">
      <button data-couche="foudre" class="c-foudre on" aria-pressed="true" aria-label="Impacts de foudre">⚡</button>
      <button data-couche="radar" class="c-radar on" aria-pressed="true" aria-label="Radar de pluie">🌧️</button>
      <button data-couche="vent" class="c-vent" aria-pressed="false" aria-label="Vent prévu">💨</button>
      <button data-couche="cape" class="c-cape" aria-pressed="false" aria-label="CAPE prévue">🔥</button>
      <button data-couche="info" class="c-info" aria-pressed="false" aria-label="Légende et sources">ℹ️</button>
      <button class="rayon" id="b-rayon" aria-label="Rayon d'alerte">⌖ 30</button>
    </div>
  </div>
</section>

<main>
  <section id="p-accueil" class="page"></section>
  <section id="p-station" class="page"></section>
  <section id="p-vigilance" class="page"></section>
  <section id="p-autre" class="page"></section>
  <section id="p-graphiques" class="page"></section>
  <section id="p-pro" class="page"></section>
  <section id="p-convection" class="page"></section>
  <section id="p-modeles" class="page"></section>
  <section id="p-fiabilite" class="page"></section>
  <section id="p-brief" class="page"></section>
  <section id="p-alertes" class="page"></section>
  <section id="p-recherche" class="page">
    <form id="f-recherche" class="row">
      <input id="q" type="search" placeholder="Ville…" minlength="2" maxlength="60" aria-label="Rechercher une ville" required style="flex:1">
      <button class="bouton" type="submit">Chercher</button>
    </form>
    <div id="res" class="res"></div>
  </section>
</main>

<nav>
  <button data-page="accueil" aria-label="Accueil"></button>
  <button data-page="chasse" aria-label="Chasse orage"></button>
  <button data-page="station" aria-label="Station"></button>
  <button data-page="vigilance" aria-label="Vigilance"></button>
  <button data-page="autre" aria-label="Autre"></button>
</nav>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/calc.js"></script>
<script src="js/graph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
